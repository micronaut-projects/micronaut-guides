def localGitPath = { String propertyName, String environmentName ->
    providers.gradleProperty(propertyName).orNull ?:
            providers.environmentVariable(environmentName).orNull
}

def discoverGraalPyBundleRepository = { File checkoutDir ->
    File bundleRoot = new File(checkoutDir, 'checkouts/maven-bundles/graalpy')
    if (!bundleRoot.isDirectory()) {
        return null
    }
    List<File> candidates = bundleRoot.listFiles()
            ?.findAll { File file ->
                file.isDirectory() &&
                        new File(file, 'org/graalvm/python/python').exists() &&
                        new File(file, 'org/graalvm/python/python-embedding').exists()
            }
            ?.sort { File left, File right -> right.lastModified() <=> left.lastModified() } ?: []
    candidates.isEmpty() ? null : candidates.first().absolutePath
}

def isUsableGraalPyBundleRepository = { String repository ->
    repository != null &&
            new File(repository, 'org/graalvm/python/python').exists() &&
            new File(repository, 'org/graalvm/python/python-embedding').exists()
}

def configureGraalPyBundleRepository = { File checkoutDir ->
    if (isUsableGraalPyBundleRepository(System.getProperty('micronaut.graalpy.bundle.repo'))) {
        return
    }
    String repository = discoverGraalPyBundleRepository(checkoutDir)
    if (repository != null) {
        System.setProperty('micronaut.graalpy.bundle.repo', repository)
        System.setProperty('pyronaut.graalpy.bundle.repo', repository)
        System.setProperty('org.gradle.project.micronaut.graalpy.bundle.repo', repository)
        System.setProperty('org.gradle.project.pyronaut.graalpy.bundle.repo', repository)
    }
}

if (providers.gradleProperty('micronaut.include.graalpy.extensions').orNull == null &&
        System.getProperty('org.gradle.project.micronaut.include.graalpy.extensions') == null) {
    System.setProperty('org.gradle.project.micronaut.include.graalpy.extensions', 'false')
}

def localMicronautCore = localGitPath(
        'local.git.micronaut-core',
        'LOCAL_GIT_MICRONAUT_CORE')
File localMicronautCoreDir = localMicronautCore ? file(localMicronautCore) : null
if (localMicronautCoreDir != null) {
    configureGraalPyBundleRepository(localMicronautCoreDir)
}
if (localMicronautCoreDir?.isDirectory() && new File(localMicronautCoreDir, '.git').exists()) {
    includeBuild(localMicronautCoreDir) {
        name = 'micronaut-core'
        dependencySubstitution {
            micronautCoreModules.each { moduleName ->
                substitute(module("io.micronaut:${moduleName}")).using(project(":${moduleName}"))
            }
        }
    }
}

def localPyronaut = localGitPath(
