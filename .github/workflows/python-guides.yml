name: Validate Python Guides
on:
  push:
    branches:
      - python
    paths:
      - '.github/workflows/python-guides.yml'
      - 'buildSrc/**'
      - 'guides/**'
      - 'settings.gradle'
      - 'src/docs/common/**'
  pull_request:
    branches:
      - python
    paths:
      - '.github/workflows/python-guides.yml'
      - 'buildSrc/**'
      - 'guides/**'
      - 'settings.gradle'
      - 'src/docs/common/**'

jobs:
  validate:
    name: Generate Python Guides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/checkout@v6.0.2
        with:
          repository: micronaut-projects/micronaut-starter
          # Python support landed in micronaut-starter#3130; pin its merge commit until 5.2.0 is released.
          ref: f1cb8016c8e555bfbae1cdbc3e11eba913befbb0
          path: micronaut-starter
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: adopt
          java-version: '25'
      - uses: actions/cache@v5.0.5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Validate build infrastructure and generate Python guides
        run: ./gradlew buildSrc:test generateAllPythonGuideTestScripts --stacktrace
        env:
          LOCAL_GIT_MICRONAUT_STARTER: ${{ github.workspace }}/micronaut-starter
