[micronaut.application]
name = "micronautguide"

#tag::liquibase[]
[liquibase.datasources.default]
change-log = "classpath:db/liquibase-changelog.xml"
#end::liquibase[]

#tag::datasource[]
[datasources.default]
schema-generate = "NONE"
# <1>
driver-class-name = "com.mysql.cj.jdbc.Driver"
# <2>
db-type = "mysql"
# <3>
dialect = "MYSQL"
#end::datasource[]
