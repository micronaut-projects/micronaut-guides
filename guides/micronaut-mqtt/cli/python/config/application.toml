#tag::mqtt[]
[mqtt.client]
server-uri = "tcp://${mqtt.host}:${mqtt.port}"
client-id = "${random.uuid}"
#end::mqtt[]

#tag::test-resources[]
[test-resources.containers.mosquitto]
image-name = "eclipse-mosquitto"
hostnames = ["mqtt.host"]

exposed-ports = [{ "mqtt.port" = 1883 }]

[[test-resources.containers.mosquitto.ro-fs-bind]]
"tests-config/mosquitto.conf" = "/mosquitto/config/mosquitto.conf"
#end::test-resources[]
