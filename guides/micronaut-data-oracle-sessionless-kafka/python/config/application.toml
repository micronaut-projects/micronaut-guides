[micronaut.application]
name = "flight-booking"

#tag::datasource[]
[datasources.default]
driver-class-name = "oracle.jdbc.OracleDriver"
db-type = "oracle"
dialect = "ORACLE"
schema-generate = "NONE"

[liquibase.datasources.default]
change-log = "classpath:db/liquibase-changelog.xml"
#end::datasource[]

#tag::testresources[]
[test-resources.containers.oracle]
image-name = "gvenzl/oracle-free"
image-tag = "23.26.3-slim-faststart"
startup-timeout = "600s"
#end::testresources[]
