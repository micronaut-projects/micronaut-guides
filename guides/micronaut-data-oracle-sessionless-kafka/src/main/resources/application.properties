micronaut.application.name=flight-booking
#tag::datasource[]
datasources.default.driver-class-name=oracle.jdbc.OracleDriver
datasources.default.db-type=oracle
datasources.default.dialect=ORACLE
datasources.default.schema-generate=NONE
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml
#end::datasource[]
#tag::kafka[]
kafka.consumers.default.auto.offset.reset=earliest
kafka.consumers.default.enable.auto.commit=false
kafka.producers.default.enable.idempotence=true
#end::kafka[]
#tag::testresources[]
test-resources.containers.oracle.image-name=gvenzl/oracle-free
test-resources.containers.oracle.image-tag=23.26.3-slim-faststart
test-resources.containers.oracle.startup-timeout=600s
#end::testresources[]
