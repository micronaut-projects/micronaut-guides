micronaut.application.name = "micronautguide"

#tag::datasource[]
[datasources.default]
# <1>
driver-class-name = "org.postgresql.Driver"
# <2>
dialect = "POSTGRES"
# <3>
schema-generate = "NONE"
#end::datasource[]

#tag::liquibase[]
[liquibase.datasources.default]
change-log = "classpath:db/liquibase-changelog.xml"
#end::liquibase[]

#tag::endpoints[]
[endpoints.liquibase]
enabled = true
sensitive = false
#end::endpoints[]
