[micronaut.application]
name = "bookcatalogue"

[micronaut.server]
port = 8081

[endpoints.health]
enabled = true
sensitive = false

#tag::jaeger[]
[otel.traces]
exporter = "otlp"

[otel.exporter.otlp]
# Jaeger supports OTLP directly. The default port for OTLP/gRPC is 4317
endpoint = "http://localhost:4317"
#end::jaeger[]
