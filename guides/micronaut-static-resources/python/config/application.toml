[micronaut.application]
name = "staticresources"

# tag::css-assets[]
[micronaut.router.static-resources.css]
mapping = "/css/*.css"
paths = "classpath:static/css"
# end::css-assets[]

# tag::image-assets[]
[micronaut.router.static-resources.images]
mapping = "/images/**"
paths = "classpath:static/images"
# end::image-assets[]
