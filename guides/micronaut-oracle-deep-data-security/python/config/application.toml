[micronaut.application]
name = "micronautguide"

#tag::port[]
# <1>
[micronaut.server]
port = 3000
#end::port[]

#tag::datasource[]
[datasources.default]
# <1>
db-type = "oracle"
# <2>
dialect = "ORACLE"
# <3>
driver-class-name = "oracle.jdbc.OracleDriver"
# <4>
schema-generate = "NONE"
#end::datasource[]

#tag::security[]
# <1>
[micronaut.security.endpoints.logout]
get-allowed = true
#end::security[]
