[micronaut.application]
name = "micronautguide"

# tag::static-resources[]
[micronaut.router.static-resources.images]
mapping = "/assets/images/**"
paths = "classpath:static/images"

[[micronaut.security.intercept-url-map]]
pattern = "/assets/images/**"
http-method = "GET"
access = ["isAnonymous()"]
# end::static-resources[]
