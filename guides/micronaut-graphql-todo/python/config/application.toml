[micronaut.application]
name = "micronautguide"

# tag::graphiql[]
[graphql.graphiql]
enabled = true
# end::graphiql[]

# tag::datasource[]
[datasources.default]
db-type = "POSTGRES"
# <2>
driver-class-name = "org.postgresql.Driver"
# <3>
dialect = "POSTGRES"
# <4>
schema-generate = "NONE"
initialization-fail-timeout = 60000
connection-timeout = 30000
# end::datasource[]

# tag::flyway[]
[flyway.datasources.default]
# <1>
enabled = true
# end::flyway[]
