[micronaut.application]
name = "micronautguide"

#tag::liquibase[]
[liquibase.datasources.default]
change-log = "classpath:db/liquibase-changelog.xml"
#end::liquibase[]

#tag::datasource[]
[datasources.default]
# <1>
driver-class-name = "org.postgresql.Driver"
# <2>
db-type = "postgres"
# <3>
dialect = "POSTGRES"
#end::datasource[]
