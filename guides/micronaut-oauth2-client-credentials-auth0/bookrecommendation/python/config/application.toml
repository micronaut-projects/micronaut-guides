#tag::mn[]
[micronaut.application]
name = "bookrecommendation"
#end::mn[]

#tag::server[]
[micronaut.server]
port = 8080
#end::server[]

[endpoints.health]
enabled = true
sensitive = false

#tag::httpservices[]
[micronaut.http.services.bookcatalogue]
url = "http://localhost:8081"

[micronaut.http.services.bookinventory]
url = "http://localhost:8082"
#end::httpservices[]

#tag::oauth2[]
# <1>
[micronaut.security.oauth2.clients.auth0]
# <2>
client-id = "${OAUTH_CLIENT_ID:xxx}"
# <3>
client-secret = "${OAUTH_CLIENT_SECRET:yyy}"
# <4>
grant-type = "client_credentials"

[micronaut.security.oauth2.clients.auth0.token]
# <5>
url = "${OAUTH_TOKEN_URL:https://micronautguides.eu.auth0.com/oauth/token}"
# <6>
authentication-method = "client_secret_post"

[micronaut.security.oauth2.clients.auth0.client-credentials]
# <7>
service-id-regex = "bookcatalogue|bookinventory"

[micronaut.security.oauth2.clients.auth0.client-credentials.additional-request-params]
# <8>
audience = "${AUTH0_API_IDENTIFIER:https://micronautguides.eu.auth0.com/api/v2/}"
#end::oauth2[]
