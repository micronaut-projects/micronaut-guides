[micronaut.application]
name = "micronautguide"

# tag::datasource[]
[datasources.default]
db-type = "postgres"
# <1>
# <2>
dialect = "POSTGRES"
driver-class-name = "${JDBC_DRIVER:org.postgresql.Driver}"
schema-generate = "NONE"
# end::datasource[]

# tag::security[]
[micronaut.security]
# <1>
authentication = "session"

[micronaut.security.redirect]
# <2>
login-success = "/"
# <3>
login-failure = "/user/authFailed"
# <4>
logout = "/"
# end::security[]

# tag::flyway[]
[flyway.datasources.default]
# <1>
enabled = true
# end::flyway[]
