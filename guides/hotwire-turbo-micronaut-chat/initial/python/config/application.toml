[micronaut.application]
name = "micronautguide"

# tag::datasource[]
[datasources.default]
dialect = "MYSQL"
driver-class-name = "${JDBC_DRIVER:com.mysql.cj.jdbc.Driver}"
db-type = "mysql"
# end::datasource[]

# tag::flyway[]
[flyway.datasources.default]
# <1>
enabled = true
# end::flyway[]

# tag::static-resources[]
# <1>
[micronaut.router.static-resources.assets]
paths = "classpath:assets"
mapping = "/assets/**"
# end::static-resources[]
