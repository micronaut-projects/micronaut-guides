#tag::mn[]
# <1>
[micronaut.application]
name = "bookrecommendation"
#end::mn[]

#tag::server[]
# <1>
[micronaut.server]
port = 8080
#end::server[]

[endpoints.health]
enabled = true
sensitive = false

#tag::oauth2[]
# <1>
# <2>
[micronaut.security.oauth2.clients.cognito]
client-id = "${OAUTH_CLIENT_ID:xxx}"
# <3>
client-secret = "${OAUTH_CLIENT_SECRET:yyy}"
# <4>
grant-type = "client_credentials"

# <5>
[micronaut.security.oauth2.clients.cognito.token]
url = "${OAUTH_TOKEN_URL:https://micronautguide.auth.us-east-1.amazoncognito.com/oauth2/token}"
# <6>
auth-method = "client_secret_basic"

# <7>
[micronaut.security.oauth2.clients.cognito.client-credentials]
service-id-regex = "bookcatalogue|bookinventory"
# <8>
scope = "example.micronaut.books/books.read"
#end::oauth2[]
