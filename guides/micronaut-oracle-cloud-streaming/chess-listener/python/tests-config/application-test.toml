[test-resources.containers.oracle]
startup-timeout = "600s"

[datasources.default]
driver-class-name = "oracle.jdbc.OracleDriver"
db-type = "oracle"
dialect = "ORACLE"

[flyway.datasources.default]
locations = ["classpath:db/migration/oracle"]
baseline-version = "0"
baseline-on-migrate = true

[oci.config]
enabled = false
