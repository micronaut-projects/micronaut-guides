#tag::datasource[]
[datasources.default]
db-type = "mysql"
# <1>
driver-class-name = "com.mysql.cj.jdbc.Driver"
# <2>
dialect = "MYSQL"
#end::datasource[]

#tag::flyway[]
[flyway.datasources.default]
# <1>
enabled = true
#end::flyway[]

#tag::endpoints[]
[endpoints.flyway]
enabled = true
sensitive = false
#end::endpoints[]
